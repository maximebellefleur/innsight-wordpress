<div class="in-pin" style="--c: {{stickerColor}}">
    <div class="in-pin__tag">
        <div class="in-pin__slot">
            {{#if imageThumb}}<img class="in-pin__img" src="{{imageThumb}}" alt="" loading="lazy" decoding="async">{{/if}}
            <div class="in-pin__wash" aria-hidden="true"></div>
            <div class="in-pin__initial" aria-hidden="true">{{initial}}</div>
        </div>
    </div>
    <div class="in-pin__string" aria-hidden="true"></div>
    <div class="in-pin__hole" aria-hidden="true"></div>
</div>
